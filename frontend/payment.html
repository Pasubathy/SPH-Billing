<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPH Billing - Payment</title>
    <link rel="stylesheet" href="css/style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .vendor-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            margin-bottom: 0px;
        }
        .vendor-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-right: 24px;
        }
        .vendor-table-container {
            margin: 0 24px 24px 24px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            flex: 1;
        }
        .vendor-table {
            width: 100%;
            border-collapse: collapse;
        }
        .vendor-table th {
            background-color: #F8FAFC;
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }
        .vendor-table th:last-child {
            border-right: none;
        }
        .vendor-table td {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .vendor-table td:last-child {
            border-right: none;
        }
        .payment-link {
            color: #2563EB;
            text-decoration: none;
            font-weight: 500;
        }
        .payment-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="app-body">
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-left">
            <img src="Images/Logo.png" alt="SPH Logo" class="app-logo">
        </div>
        <div class="top-bar-right">
            <div class="user-profile">
                <div class="user-avatar" style="overflow: hidden;">
                    <img src="Images/profile_avatar.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <span class="user-name">SPH</span>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <a href="#" class="nav-item">
                <img src="Icons/Home icon.svg" alt="Home" class="nav-icon">
                <span>Home</span>
            </a>
            <a href="items.html" class="nav-item">
                <img src="Icons/Items icon.svg" alt="Items" class="nav-icon">
                <span>Items</span>
            </a>
            <a href="sales.html" class="nav-item">
                <img src="Icons/Sales icon.svg" alt="Sales" class="nav-icon">
                <span>Sales</span>
            </a>
            <a href="vendor.html" class="nav-item active">
                <img src="Icons/Vendor Icon.svg" alt="Vendor" class="nav-icon">
                <span>Vendor</span>
            </a>
            <a href="#" class="nav-item">
                <img src="Icons/Customer icon.svg" alt="Customer" class="nav-icon">
                <span>Customer</span>
            </a>
            <a href="#" class="nav-item">
                <img src="Icons/Voucher icon.svg" alt="Voucher" class="nav-icon">
                <span>Voucher</span>
            </a>
        </nav>

        <!-- Main Content -->
        <main class="main-content" style="display: flex; flex-direction: column; overflow-y: auto; background-color: #F8FAFC;">
            <!-- Tabs -->
            <div class="page-tabs" style="padding: 0 24px 0 0; border-bottom: 1px solid var(--border-color); background-color: white;">
                <a href="vendor.html" class="tab">Vendor</a>
                <a href="purchase-invoice.html" class="tab">Purchase Invoice</a>
                <a href="#" class="tab">Purchase Return</a>
                <a href="payment.html" class="tab active">Payment</a>
            </div>

            <!-- Controls (Search, Export, Create) -->
            <div class="vendor-controls">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <h2 class="vendor-title" style="margin-right: 0;">Payment</h2>
                    
                    <!-- Date Filter Button -->
                    <button class="date-filter-btn" id="paymentDateFilterBtn" data-target="paymentList" style="background-color: white; font-size: 13px; border-radius: 6px; height: 38px; border: 1px solid var(--border-color); padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; min-width: 110px; font-family: inherit;">
                        <span class="date-filter-text" id="paymentDateFilterText">Date</span>
                        <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-muted);"></i>
                    </button>

                    <!-- Vendor Name Dropdown Filter -->
                    <div class="custom-dropdown" id="paymentVendorFilterDropdown" data-select="paymentVendorFilter" style="min-width: 160px; width: 160px; height: 38px; position: relative; z-index: 100;">
                        <select id="paymentVendorFilter" style="display:none;">
                            <option value="">Vendor Name</option>
                        </select>
                        <div class="custom-dropdown-trigger" style="height: 100%; padding: 0 12px; border: 1px solid var(--border-color); border-radius: 6px; background-color: white; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 13px; font-weight: 500;">
                            <span class="trigger-text placeholder">Vendor Name</span>
                            <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-muted);"></i>
                        </div>
                        <div class="custom-dropdown-panel" style="min-width: 100%; right: 0;"></div>
                    </div>

                    <!-- Search Bar -->
                    <div style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 6px; background: white; height: 38px; width: 220px; padding: 0 12px; box-sizing: border-box;">
                        <input type="text" id="paymentSearchInput" placeholder="Search" style="border: none; outline: none; font-family: inherit; font-size: 13px; width: 100%;">
                        <i data-lucide="search" style="width: 14px; height: 14px; color: var(--text-muted); margin-left: 8px;"></i>
                    </div>

                    <!-- Cancel Button [ x ] -->
                    <button id="clearPaymentFilterBtn" style="background: white; border: 1px solid var(--border-color); border-radius: 6px; height: 38px; width: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); padding: 0; box-sizing: border-box;">
                        <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                    </button>
                </div>
                
                <div style="display: flex; align-items: center; gap: 12px;">
                    <!-- Export Dropdown -->
                    <div class="select-wrapper-custom" style="width: 110px; height: 38px;">
                        <select style="background-color: white !important; font-size: 14px; border-radius: 6px; height: 100%; padding-right: 28px; width: 100%; border: 1px solid var(--border-color); appearance: none; padding-left: 12px;">
                            <option value="">Export</option>
                        </select>
                        <i data-lucide="chevron-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted); pointer-events: none;"></i>
                    </div>

                    <!-- Create Button -->
                    <a href="create-payment.html" style="text-decoration: none; height: 38px; padding: 0 20px; border: none; border-radius: 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; background: #000B58; cursor: pointer; color: white; font-weight: 600; box-sizing: border-box; font-family: inherit;">
                        <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                        <span>Create</span>
                    </a>
                </div>
            </div>

            <!-- Table -->
            <div class="vendor-table-container">
                <table class="vendor-table">
                    <thead>
                        <tr style="height: 40px;">
                            <th style="width: 70px;">S. No.</th>
                            <th style="width: 120px;">Date</th>
                            <th style="width: 150px;">Payment No</th>
                            <th style="width: 250px;">Vendor Name</th>
                            <th style="width: 200px;">Contact Number</th>
                            <th style="width: 150px;">Paid Amount</th>
                        </tr>
                    </thead>
                    <tbody id="paymentTableBody">
                        <!-- Empty State -->
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 32px; color: var(--text-muted);">
                                Loading payments...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- Global Date Picker Popup -->
    <div id="globalDateFilterPopup" class="date-picker-popup" style="display: none; position: absolute; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid var(--border-color); width: 280px; padding: 12px; z-index: 2000; box-sizing: border-box;">
        <!-- Tabs -->
        <div class="date-picker-tabs" style="display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap;">
            <button class="date-tab-btn active" data-tab="day" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid #E2E8F0; background: #000B58; color: white; font-size: 13px; font-weight: 500; cursor: pointer;">
                <i data-lucide="check-circle-2" style="width: 14px; height: 14px; color: #22c55e;"></i> Day
            </button>
            <button class="date-tab-btn" data-tab="week" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid #E2E8F0; background: #F8FAFC; color: var(--text-main); font-size: 13px; font-weight: 500; cursor: pointer;">
                <i data-lucide="check-circle-2" style="width: 14px; height: 14px; color: #CBD5E1;"></i> Week
            </button>
            <button class="date-tab-btn" data-tab="month" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid #E2E8F0; background: #F8FAFC; color: var(--text-main); font-size: 13px; font-weight: 500; cursor: pointer;">
                <i data-lucide="check-circle-2" style="width: 14px; height: 14px; color: #CBD5E1;"></i> Month
            </button>
            <button class="date-tab-btn" data-tab="year" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid #E2E8F0; background: #F8FAFC; color: var(--text-main); font-size: 13px; font-weight: 500; cursor: pointer;">
                <i data-lucide="check-circle-2" style="width: 14px; height: 14px; color: #CBD5E1;"></i> Year
            </button>
            <button class="date-tab-btn" data-tab="custom" style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 1px solid #E2E8F0; background: #F8FAFC; color: var(--text-main); font-size: 13px; font-weight: 500; cursor: pointer;">
                <i data-lucide="check-circle-2" style="width: 14px; height: 14px; color: #CBD5E1;"></i> Custom
            </button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="datePickerContent" style="min-height: 200px;">
            <!-- Content will be injected by JS -->
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/date-filter.js?v=2"></script>
    <script src="js/payment.js?v=1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
