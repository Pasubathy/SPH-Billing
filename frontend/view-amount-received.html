<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPH Billing - View Amount Received</title>
    <link rel="stylesheet" href="css/style.css?v=9">
    <link rel="stylesheet" href="css/sales.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .view-item-container {
            display: flex;
            gap: 16px;
            padding: 16px 16px 0px 16px;
            height: calc(100vh - 140px);
            overflow: hidden;
        }

        .products-sidebar-left {
            width: 280px;
            min-width: 240px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-search-sticky {
            padding: 12px 12px 0px 12px;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-search-sticky input {
            width: 100%;
            height: 38px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #F8F9FA;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
        }

        .sidebar-products-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-product-card {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-product-card.active {
            border-color: #000B58;
            background-color: #F0F4FF;
        }

        .sidebar-product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .sidebar-product-cat {
            font-size: 13px;
            color: var(--text-muted);
        }

        .details-viewer-right {
            flex: 1;
            background: #F1F5F9;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            box-sizing: border-box;
        }
        
        /* A5 Printable Canvas */
        .inv-preview-container { 
            background: white; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            padding: 24px; 
            font-family: 'Inter', sans-serif; 
            font-size: 11px; 
            color: #000; 
            margin: 0 auto; 
            width: 100%; 
            max-width: 600px;
            box-sizing: border-box; 
        }
        .inv-preview-container .header { 
            text-align: center; 
            border-bottom: 1px dashed #000; 
            margin-bottom: 12px; 
            position: relative; 
        }
        .inv-preview-container .comp-name { 
            font-size: 1.4em; 
            font-weight: 700; 
            margin-bottom: 4px; 
            text-transform: uppercase; 
        }
        .inv-preview-container .comp-detail { 
            font-size: 0.9em; 
            line-height: 1.4; 
            color: #000; 
        }
        
        .ar-info-grid {
            display: grid;
            grid-template-columns: auto 1fr auto 1fr;
            gap: 8px 16px;
            margin-bottom: 16px;
            font-size: 11px;
        }
        
        .ar-info-label { font-weight: 600; }
        
        .print-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }
        
        .print-table th, .print-table td {
            border: 1px solid #E5E7EB;
            padding: 8px;
            text-align: left;
        }
        
        .print-table th {
            background-color: #F3F4F6;
            font-weight: 600;
        }
        
        .totals-section {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #000;
        }

        .icon-btn-danger {
            background-color: #FEE2E2;
            border: 1px solid #FCA5A5;
            color: #EF4444;
            width: 35px;
            height: 35px;
            padding: 0;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn-danger:hover {
            background-color: #EF4444;
            color: white;
        }

        .icon-btn-outline {
            background-color: white;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 35px;
            height: 35px;
            padding: 0;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn-outline:hover {
            background-color: #F8F9FA;
            border-color: #CBD5E1;
        }
        
        /* Print Styles */
        @media print {
            body { background: white !important; height: auto !important; overflow: visible !important; }
            body * { visibility: visible !important; }
            .sidebar, .top-bar, .page-header, .sticky-action-bar-new, .products-sidebar-left { display: none !important; }
            .main-content { overflow: visible !important; height: auto !important; padding: 0 !important; background: white !important; display: block !important; }
            .app-container { display: block !important; height: auto !important; overflow: visible !important; }
            .view-item-container { display: block !important; height: auto !important; overflow: visible !important; padding: 0 !important; }
            .details-viewer-right { background: white !important; border: none !important; padding: 0 !important; overflow: visible !important; display: block !important; height: auto !important; }
            .inv-preview-container { box-shadow: none !important; margin: 0 !important; max-width: none !important; width: 100% !important; padding: 0 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body class="app-body">
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-left">
            <img src="Images/Logo.png" alt="SPH Logo" class="app-logo">
        </div>
        <div class="top-bar-right">
            <div class="user-profile">
                <div class="user-avatar" style="overflow: hidden;">
                    <img src="Images/profile_avatar.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <span class="user-name">SPH</span>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <a href="#" class="nav-item">
                <img src="Icons/Home icon.svg" alt="Home" class="nav-icon">
                <span>Home</span>
            </a>
            <a href="items.html" class="nav-item">
                <img src="Icons/Items icon.svg" alt="Items" class="nav-icon">
                <span>Items</span>
            </a>
            <a href="sales.html" class="nav-item active">
                <img src="Icons/Sales icon.svg" alt="Sales" class="nav-icon">
                <span>Sales</span>
            </a>
            <a href="vendor.html" class="nav-item">
                <img src="Icons/Vendor Icon.svg" alt="Vendor" class="nav-icon">
                <span>Vendor</span>
            </a>
            <a href="#" class="nav-item">
                <img src="Icons/Customer icon.svg" alt="Customer" class="nav-icon">
                <span>Customer</span>
            </a>
            <a href="#" class="nav-item">
                <img src="Icons/Voucher icon.svg" alt="Voucher" class="nav-icon">
                <span>Voucher</span>
            </a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Page Header -->
            <div class="page-header" style="height: 45px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; background-color: white; border-bottom: 1px solid var(--border-color); flex-shrink: 0;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <a href="sales.html" style="color: #000B58; display: flex; align-items: center; justify-content: center; text-decoration: none;">
                        <i data-lucide="arrow-left" style="width: 20px; height: 20px; stroke-width: 2.5;"></i>
                    </a>
                    <h1 class="page-title" id="pageTitleName" style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text-main);">AR001</h1>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button class="icon-btn-danger" id="deleteArBtn">
                        <i data-lucide="trash-2" style="width: 20px; height: 20px;"></i>
                    </button>
                    <button class="icon-btn-outline" id="editArBtn">
                        <i data-lucide="edit-3" style="width: 20px; height: 20px;"></i>
                    </button>
                </div>
            </div>

            <!-- View Layout -->
            <div class="view-item-container">
                <!-- Left Sidebar -->
                <div class="products-sidebar-left">
                    <div class="sidebar-search-sticky">
                        <input type="text" id="sidebarSearch" placeholder="Search Customer/AR No">
                    </div>
                    <div class="sidebar-products-list" id="sidebarArList">
                        <!-- ARs listed dynamically here -->
                    </div>
                </div>

                <!-- Right Side A5 Canvas -->
                <div class="details-viewer-right">
                    <div class="inv-preview-container" id="arPreviewCanvas">
                        <!-- Canvas will be populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Bottom Action Footer -->
            <div class="sticky-action-bar-new" style="justify-content: space-between;">
                <a href="sales.html" class="btn-footer-outline" style="text-decoration: none; color: var(--text-main); font-weight: 500;">
                    <i data-lucide="chevron-left" style="width: 16px; height: 16px; margin-right: 4px; stroke-width: 2.5;"></i> Back
                </a>
                <div style="display: flex; gap: 12px;">
                    <button id="exportArBtn" style="background: white; border: 1px solid #000B58; border-radius: 6px; padding: 8px 24px; font-family: inherit; font-size: 14px; font-weight: 500; color: #000B58; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        Export
                    </button>
                    <button id="printArBtn" style="background: #000B58; border: none; border-radius: 6px; padding: 8px 24px; font-family: inherit; font-size: 14px; font-weight: 500; color: white; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        Print
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: white; border-radius: 8px; width: 400px; max-width: 90%; padding: 24px;">
            <h3 style="font-size: 16px; font-weight: 600; margin: 0 0 12px 0;">Delete Amount Received</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin: 0;">Are you sure you want to delete this record? This action cannot be undone.</p>
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                <button id="cancelDeleteBtn" style="background: white; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px;">No, Cancel</button>
                <button id="confirmDeleteBtn" style="background: #EF4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px;">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script src="js/view-amount-received.js"></script>
</body>
</html>
